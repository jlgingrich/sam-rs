[package]
name = "sam-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
color-eyre = "0.6.5"
csv = "1.4.0"
serde = { version = "1.0.229", features = ["serde_derive"] }
serde_json = "1.0.151"
steamworks = "0.13.1"
tabwriter = "1.4.1"

[lints.clippy]
pedantic = { level = "deny", priority = -1 } # UM, ACTUALLY
nursery = { level = "deny", priority = -1 }  # BETA LINTS
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
